<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>San Mateo — ROW Acquisition Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg: #131f38;
    --panel: #1c2c4d;
    --panel-2: #17233d;
    --line: #2d4370;
    --line-soft: #23345a;
    --ink: #dde4f4;
    --ink-dim: #8ea0c4;
    --ink-faint: #7688ac;
    --blue: #7d93c3;
    --blue-soft: #445f92;
    --blue-glow: rgba(125,147,195,0.18);
    --grey-bar: #445f92;
    --refusal: #b3707a;
    --green: #9ecb4a;
    --green-soft: #5f7a2e;
    --green-glow: rgba(158,203,74,0.14);
    --table-bg: #17233d;
    --table-line: #2d4370;
    --font-sans: 'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(1200px 800px at 12% -10%, #1e2f52 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: var(--font-sans);
    line-height: 1.5;
    min-height:100vh;
    padding: 32px 20px 60px;
  }
  .wrap{ max-width: 1920px; margin: 0 auto; }

  .logo-chip{
    background: #ffffff;
    border-radius: 8px;
    padding: 6px 14px;
    display:inline-flex;
    align-items:center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    flex: none;
  }
  .logo{ height: 30px; width:auto; display:block; }

  header.top{
    display:flex; justify-content:space-between; align-items:flex-end;
    flex-wrap:wrap; gap:16px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 22px;
    margin-bottom: 26px;
  }
  .header-right{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    justify-content:flex-end;
  }
  .eyebrow{
    font-family: var(--font-mono);
    font-size: 12.5px;
    letter-spacing: 0.02em;
    color: var(--green);
    margin: 0 0 8px 0;
  }
  h1{
    font-size: 26px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .report-date{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-dim);
    text-align:right;
  }
  .updated-stamp{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 8px;
  }
  .updated-stamp{ display:flex; align-items:center; gap:8px; }
  .updated-stamp .seg-mark{ width:18px; height:18px; opacity:0.6; flex:none; }
  .updated-stamp span{ color: var(--ink-dim); }
  .report-date .d{ color: var(--ink); font-size:15px; display:block; margin-top:2px; }

  nav.tabs{
    display:flex; gap:6px; flex-wrap:wrap;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--line);
  }
  nav.tabs button{
    font-family: var(--font-sans);
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 14.5px;
    font-weight: 500;
    padding: 12px 6px;
    margin-right: 22px;
    cursor: pointer;
    position: relative;
    top: 1px;
  }
  nav.tabs button .n{
    display:block; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); margin-top:3px;
  }
  nav.tabs button.active{ color: var(--green); }
  nav.tabs button.active::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background: var(--green);
  }
  nav.tabs button:hover{ color: var(--ink); }

  .project{ display:none; }
  .project.active{ display:block; animation: fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .hero{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }
  .hero .stage{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px 9px;
  }
  .hero .stage .label{ font-size: 10.5px; color: var(--ink-dim); margin-bottom: 6px; }
  .hero .stage .pct{
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .hero .stage .pct span{ font-size: 12px; color: var(--ink-faint); font-weight: 400; }
  .track{
    height: 5px; border-radius: 3px; background: var(--line-soft); overflow:hidden;
  }
  .track > i{ display:block; height:100%; background: var(--green); border-radius:3px; }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 860px){
    .grid{ grid-template-columns: 1fr; }
    .hero{ grid-template-columns: repeat(2, 1fr); }
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 13px 14px 11px;
  }
  .card.status-card{ border-color: var(--green); }
  .card h2{
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .card .sub{
    font-size: 11px; color: var(--ink-faint); margin-bottom: 10px;
  }

  table.rows{ width:100%; border-collapse: collapse; margin-bottom: 4px; }
  table.rows th{
    text-align:left; font-size: 9.5px; font-weight:500; color: var(--ink-faint);
    padding-bottom: 5px; border-bottom: 1px solid var(--line-soft);
  }
  table.rows th.num, table.rows td.num{ text-align:right; font-family: var(--font-mono); }
  table.rows td{
    padding: 5px 0; font-size: 11px; border-bottom: 1px solid var(--line-soft);
    vertical-align: middle;
  }
  table.rows tr:last-child td{ border-bottom: none; font-weight:600; }
  table.rows td.rowlabel{ color: var(--ink-dim); }
  tr:last-child td.rowlabel{ color: var(--ink); }
  td.bar-cell{ width: 34%; }
  .stackbar{ height: 8px; border-radius: 4px; overflow:hidden; display:flex; background: var(--line-soft); }
  .stackbar i{ display:block; height:100%; }
  .seg-working{ background: var(--grey-bar); }
  .seg-complete, .seg-acquired, .seg-executed{ background: var(--green); }
  .seg-refusal{ background: var(--refusal); }
  .seg-negotiating{ background: var(--grey-bar); }

  .legend{
    display:flex; gap:16px; flex-wrap:wrap; margin-top: 14px; padding-top: 12px;
    border-top: 1px solid var(--line-soft);
  }
  .legend span{ font-size: 11.5px; color: var(--ink-faint); display:flex; align-items:center; gap:6px; }
  .legend i{ width:9px; height:9px; border-radius:2px; display:inline-block; }

  .mileage{
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-soft);
    display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .mileage .m-item .m-label{ font-size: 11px; color: var(--ink-faint); margin-bottom: 4px; }
  .mileage .m-item .m-val{ font-family: var(--font-mono); font-size: 15px; color: var(--ink); }
  .mileage .m-item.acc .m-val{ color: var(--green); }

  footer{
    margin-top: 34px; font-size: 12px; color: var(--ink-faint); text-align:center;
  }

  .card.wide{ grid-column: 1 / -1; margin-top: 2px; }
  .card-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    margin-bottom: 16px; flex-wrap:wrap;
  }
  input.search{
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 13px;
    padding: 9px 12px;
    width: 240px;
    max-width: 100%;
    outline: none;
  }
  input.search::placeholder{ color: var(--ink-faint); }
  input.search:focus{ border-color: var(--blue-soft); }

  .table-scroll{
    overflow-x:auto;
    background: var(--table-bg);
    border: 1px solid var(--green);
    border-radius: 10px;
    padding: 6px 16px;
  }
  table.detail{ min-width: 640px; }
  table.detail th{ white-space:nowrap; padding: 6px 6px 5px; border-bottom-color: var(--table-line); }
  table.detail th.sortable{ cursor: pointer; user-select: none; }
  table.detail th.sortable:hover{ color: var(--ink); }
  .sort-arrow{ font-size: 9px; color: var(--green); margin-left: 2px; }
  table.detail th:first-child{ padding-left:0; }
  table.detail th:last-child{ padding-right:0; }
  table.detail th.num, table.detail td.num{ text-align:right; font-family: var(--font-mono); }
  table.detail td{ white-space:nowrap; font-size:11px; padding: 5px 6px; border-bottom-color: var(--table-line); }
  table.detail td:first-child{ padding-left:0; }
  table.detail td:last-child{ padding-right:0; }
  table.detail tr:last-child td{ font-weight:400; }
  .mono{ font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-dim); }
  .more{ font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); }

  .badge{
    display:inline-block;
    font-size: 9.5px;
    font-family: var(--font-mono);
    padding: 2px 5px;
    border-radius: 5px;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .badge-acquired{ color: #c3dd8a; border-color: var(--green-soft); background: var(--green-glow); }
  .badge-complete{ color: #b3c6ff; border-color: var(--blue-soft); background: var(--blue-glow); }
  .badge-open{ color: var(--ink-dim); border-color: var(--line); background: var(--line-soft); }
  .badge-working{ color: var(--ink); border-color: var(--grey-bar); background: rgba(65,76,99,0.35); }
  .badge-refusal{ color: #ddb9bc; border-color: var(--refusal); background: rgba(154,107,111,0.18); }

  .week-pair{
    display:flex; flex-wrap:wrap; margin-bottom: 4px;
    background: var(--table-bg);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .week-block{ flex: 1 1 260px; min-width: 240px; }
  .week-block:not(:first-child){
    border-left: 1px solid var(--table-line);
    margin-left: 16px;
    padding-left: 16px;
  }
  .week-label{
    font-family: var(--font-mono); font-size: 11px; letter-spacing:0.02em;
    color: var(--ink-faint); margin-bottom: 8px;
  }
  .week-block:last-child .week-label{ color: var(--green); }
  table.sheet-table{ width:100%; border-collapse: collapse; }
  table.sheet-table th{
    text-align:right; font-size: 10.5px; font-weight:500; color: var(--ink-faint);
    padding: 0 4px 7px; border-bottom: 1px solid var(--table-line);
  }
  table.sheet-table th:first-child{ text-align:left; padding-left:0; }
  table.sheet-table td{
    padding: 7px 4px; font-size: 12.5px; font-family: var(--font-mono);
    text-align:right; border-bottom: 1px solid var(--table-line); color: var(--ink);
  }
  table.sheet-table td:first-child{ text-align:left; font-family: var(--font-sans); color: var(--ink-dim); padding-left:0; }
  table.sheet-table td:last-child{ padding-right:0; }
  table.sheet-table th:last-child{ padding-right:0; }
  table.sheet-table tr:last-child td{ font-weight:600; border-bottom:none; }
  table.sheet-table tr:last-child td:first-child{ color: var(--ink); }
  table.sheet-table td.pos{ color: var(--green); }
  table.sheet-table td.neg{ color: var(--refusal); }
  .mileage-heading{
    font-size: 12px; color: var(--ink-faint); margin: 16px 0 10px;
    padding-top: 14px; border-top: 1px solid var(--line-soft);
  }

  /* Project snapshot: donut + bar chart */
  .snapshot-grid{
    display:grid; grid-template-columns: 230px 1fr; gap: 32px; align-items:center;
  }
  @media (max-width: 700px){ .snapshot-grid{ grid-template-columns: 1fr; } }
  .donut-block{ display:flex; align-items:center; gap: 20px; flex-wrap:wrap; }
  .donut-outer{ position:relative; width:150px; height:150px; flex:none; }
  .donut{ position:absolute; inset:0; border-radius:50%; }
  .donut-hole{
    position:absolute; inset:26px; border-radius:50%; background: var(--panel);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .donut-total{ font-family: var(--font-mono); font-size: 22px; font-weight:600; color: var(--ink); }
  .donut-total-label{ font-size: 11px; color: var(--ink-faint); margin-top:2px; }
  .donut-legend{ display:flex; flex-direction:column; gap: 9px; }
  .donut-legend-item{ display:flex; align-items:center; gap: 8px; font-size: 12.5px; color: var(--ink-dim); }
  .donut-legend-item i{ width:9px; height:9px; border-radius:3px; display:inline-block; flex:none; }
  .donut-legend-val{ font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); }
  .bar-chart{ display:flex; flex-direction:column; gap: 18px; }
  .bar-group{ display:flex; flex-direction:column; gap: 12px; }
  .bar-group:not(:first-child){ padding-top: 16px; border-top: 1px solid var(--line-soft); }
  .bar-group-title{ font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .bar-row{ display:grid; grid-template-columns: 140px 1fr 38px; align-items:center; gap: 10px; }
  .bar-row-label{ font-size: 12.5px; color: var(--ink-dim); }
  .bar-row-track{ height: 7px; border-radius: 4px; background: var(--line-soft); overflow:hidden; }
  .bar-row-fill{ height:100%; background: var(--green); border-radius:4px; }
  .bar-row-val{ font-family: var(--font-mono); font-size: 12px; text-align:right; color: var(--ink); }

  /* Overview page */
  .filter-bar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    margin-bottom: 22px;
  }
  input.search.wide-search{ width: 340px; max-width: 100%; }

  .ov-grid{
    display:grid; grid-template-columns: 1fr; gap: 16px;
  }

  .ov-card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    display:flex; flex-direction:column; gap: 16px;
    transition: border-color .15s ease;
  }
  .ov-card:hover{ border-color: var(--green-soft); }
  .ov-head h3{ margin:0 0 4px; font-size: 16px; font-weight: 600; }
  .ov-tracts{ font-size: 12px; color: var(--ink-faint); font-family: var(--font-mono); }
  .ov-stages{ display:flex; flex-direction:column; gap: 9px; }
  .ov-stage{ display:grid; grid-template-columns: 132px 1fr 36px; align-items:center; gap: 10px; }
  .ov-stage-label{ font-size: 12px; color: var(--ink-dim); }
  .ov-stage-pct{ font-family: var(--font-mono); font-size: 12px; text-align:right; color: var(--ink); }
  .ov-notes{
    padding-top: 14px; border-top: 1px solid var(--line-soft);
  }
  .ov-notes-heading{
    font-family: var(--font-mono); font-size: 11px; letter-spacing:0.02em;
    color: var(--green); margin-bottom: 10px;
  }
  .ov-notes-group + .ov-notes-group{ margin-top: 12px; }
  .ov-notes-label{ font-size: 11.5px; font-weight:600; color: var(--ink-dim); margin-bottom: 6px; }
  .ov-notes-list{ margin: 0; padding-left: 18px; }
  .ov-notes-list li{ font-size: 12.5px; color: var(--ink); line-height: 1.5; margin-bottom: 4px; }
  .ov-notes-list li:last-child{ margin-bottom: 0; }
  .ov-foot{
    display:flex; justify-content:space-between; align-items:center;
    padding-top: 14px; border-top: 1px solid var(--line-soft);
  }
  .ov-mileage{ font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); }
  .ov-btn{
    font-family: var(--font-sans);
    background: none;
    border: 1px solid var(--green-soft);
    color: var(--green);
    font-size: 12.5px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .ov-btn:hover{ background: var(--green-glow); }
  .ov-card.hidden{ display:none; }
  @media (max-width: 480px){
    .ov-foot{ flex-wrap: wrap; gap: 10px; }
    .ov-btn{ width: 100%; text-align:center; }
  }

  /* Landowner note popup */
  .landowner-link{
    background:none; border:none; padding:0; margin:0;
    font-family: var(--font-sans); font-size: 11px; color: var(--ink);
    text-decoration: underline dotted var(--ink-faint); text-underline-offset: 3px;
    cursor: pointer;
  }
  .landowner-link:hover{ color: var(--green); text-decoration-color: var(--green); }
  .landowner-link.mono-link{ font-family: var(--font-mono); font-size: 10.5px; }
  .tract-popup-overlay{
    display:none; position:fixed; inset:0; background: rgba(6,10,18,0.6);
    align-items:center; justify-content:center; z-index: 10000; padding: 20px;
  }
  .tract-popup-overlay.active{ display:flex; }
  .tract-popup{
    background: var(--panel);
    border: 1px solid var(--green);
    border-radius: 12px;
    padding: 22px 24px;
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .tract-popup-head{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-bottom: 14px; gap: 12px;
  }
  .tract-popup-head h3{ margin:0 0 3px; font-size: 16px; font-weight:600; color: var(--ink); }
  .tract-popup-head .mono{ font-size: 12px; }
  .tract-popup-close{
    background:none; border:1px solid var(--line); color: var(--ink-dim);
    border-radius: 6px; width: 26px; height: 26px; cursor: pointer; flex: none;
    font-size: 14px; line-height: 1;
  }
  .tract-popup-close:hover{ color: var(--ink); border-color: var(--green-soft); }
  .tract-popup-owners{
    display:flex; flex-direction:column; gap: 5px; margin-bottom: 16px;
    padding-bottom: 14px; border-bottom: 1px solid var(--line-soft);
  }
  .tract-popup-owners .label{ font-size: 11px; color: var(--ink-faint); margin-bottom: 4px; }
  .tract-popup-owners .owner{ font-size: 13.5px; color: var(--ink); }
  .tract-popup-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-bottom: 16px;
  }
  .tract-popup-grid .item .label{ font-size: 11px; color: var(--ink-faint); margin-bottom: 3px; }
  .tract-popup-grid .item .val{ font-size: 13.5px; color: var(--ink); font-family: var(--font-mono); }
  .tract-popup-badges{
    display:flex; flex-direction:column; gap: 8px;
    padding-top: 14px; border-top: 1px solid var(--line-soft);
  }
  .tract-popup-badges .row{ display:flex; justify-content:space-between; align-items:center; }
  .tract-popup-badges .row .label{ font-size: 12.5px; color: var(--ink-dim); }

  .tract-notes{ margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line-soft); }
  .tract-notes-heading{
    font-size: 12px; color: var(--ink-faint); margin-bottom: 10px;
    display:flex; align-items:center; gap: 8px;
  }
  .tract-notes-heading .count{
    font-family: var(--font-mono); font-size: 10.5px; color: var(--green);
    border: 1px solid var(--green-soft); background: var(--green-glow);
    border-radius: 10px; padding: 1px 7px;
  }
  .tract-notes-empty{ font-size: 12.5px; color: var(--ink-faint); font-style: italic; }
  .note-entry{
    padding: 10px 0; border-bottom: 1px solid var(--line-soft);
  }
  .note-entry:last-child{ border-bottom: none; padding-bottom: 0; }
  .note-meta{
    display:flex; justify-content:space-between; gap: 10px; margin-bottom: 5px;
  }
  .note-date{ font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
  .note-by{ font-size: 11px; color: var(--blue); font-weight: 500; }
  .note-owner{ font-size: 10.5px; color: var(--ink-faint); margin-bottom: 4px; font-style: italic; }
  .note-text{ font-size: 13px; color: var(--ink-dim); line-height: 1.5; }

  .project-layout{
    display: grid;
    grid-template-columns: minmax(520px, 760px) 1fr;
    gap: 18px;
    align-items: stretch;
  }
  @media (max-width: 1200px){
    .project-layout{ grid-template-columns: minmax(400px, 500px) 1fr; }
  }
  @media (max-width: 900px){
    .project-layout{ grid-template-columns: 1fr; }
  }

  .parcel-map-card{
    position: sticky;
    top: 14px;
    z-index: 5;
  }
  .parcel-map{
    height: clamp(420px, calc(100vh - 210px), 860px);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
    margin-top: 14px;
    background: var(--panel-2);
  }
  .map-legend{
    display:flex; flex-wrap:wrap; gap: 8px;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line-soft);
  }
  .map-legend-item{
    display:flex; align-items:center; gap: 7px; font-size: 12.5px; color: var(--ink-dim);
    background: none; border: 1px solid transparent; border-radius: 8px;
    padding: 5px 10px; cursor: pointer; font-family: var(--font-sans);
  }
  .map-legend-item:hover{ background: var(--panel-2); }
  .map-legend-item.active{ border-color: var(--green-soft); background: var(--green-glow); color: var(--ink); }
  .map-legend-item.all-btn{ font-weight: 600; }
  .map-legend-item i{ width: 10px; height: 10px; border-radius: 3px; display:inline-block; flex: none; }
  .map-legend-item.route-item.inactive{ opacity: 0.4; }
  .map-legend-item.route-item.inactive .route-swatch{ border-top-style: dotted; }
  .route-swatch{
    width: 16px !important; height: 0 !important; border-radius: 0 !important;
    border-top: 2px solid #e0483c;
  }
  .badge-btn{ cursor: pointer; margin: 0; }
  .badge-btn:hover{ filter: brightness(1.2); }
  .map-view-btn{
    font-family: var(--font-sans);
    background: none;
    border: 1px solid var(--green-soft);
    color: var(--green);
    font-size: 12.5px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 16px;
    width: 100%;
  }
  .map-view-btn:hover{ background: var(--green-glow); }

  /* Leaflet dark-theme touches */
  .leaflet-container{ background: var(--panel-2); font-family: var(--font-sans); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip{ background: var(--panel); color: var(--ink); }
  .leaflet-popup-content{ font-size: 12.5px; }
  .leaflet-popup-content b{ color: var(--ink); }
  .leaflet-control-attribution{ background: rgba(23,35,61,0.75) !important; color: var(--ink-faint) !important; font-size: 10px !important; }
  .leaflet-control-attribution a{ color: var(--blue) !important; }
  .leaflet-bar a{ background: var(--panel); color: var(--ink); border-bottom: 1px solid var(--line) !important; }
  .leaflet-bar a:hover{ background: var(--panel-2); }
  .leaflet-tooltip{
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    font-family: var(--font-sans); font-size: 12px;
  }
  .leaflet-tooltip-top:before{ border-top-color: var(--line); }
</style>

function pct(n,d){ return d>0 ? (n/d*100) : 0; }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtVal(v, isMileage){
  if (v === null || v === undefined) return '—';
  if (isMileage) return v.toFixed(2);
  const r = Math.round(v*100)/100;
  return (Math.round(r) === r) ? Math.round(r).toString() : r.toString();
}

function parseRow(row, midCount){
  const [label, total, ...rest] = row;
  const mids = rest.slice(0, midCount);
  const change = rest[midCount];
  const pctVal = rest[midCount+1];
  return { label, total, mids, change, pctVal };
}

function weekBlock(rowsArr, weekLabel, def){
  let out = `<div class="week-block"><div class="week-label">${weekLabel}</div>
    <table class="sheet-table"><thead><tr><th>Tract Line</th><th class="num">${def.totalLabel || 'Total Tracts'}</th>`;
  def.mid.forEach(m => out += `<th class="num">${m}</th>`);
  out += `<th class="num">Change</th><th class="num">${def.pctLabel}</th></tr></thead><tbody>`;
  rowsArr.forEach(row => {
    const r = parseRow(row, def.mid.length);
    const changeCls = r.change > 0 ? 'pos' : (r.change < 0 ? 'neg' : '');
    const changeStr = r.change === null ? '—' : (r.change > 0 ? '+' : '') + fmtVal(r.change, def.isMileage);
    out += `<tr><td class="rowlabel">${r.label}</td><td class="num">${fmtVal(r.total, def.isMileage)}</td>`;
    r.mids.forEach(v => out += `<td class="num">${fmtVal(v, def.isMileage)}</td>`);
    out += `<td class="num ${changeCls}">${changeStr}</td>`;
    const pctDisplay = (r.pctVal === null || r.pctVal === undefined)
      ? (r.total > 0 ? Math.round(r.mids[def.doneIdx] / r.total * 100) + '%' : '—')
      : (r.pctVal * 100).toFixed(0) + '%';
    out += `<td class="num">${pctDisplay}</td></tr>`;
  });
  out += `</tbody></table></div>`;
  return out;
}

}

}

function filterTracts(input, key){
  const q = input.value.toLowerCase();
  document.querySelectorAll('#detail-'+key+' tbody tr').forEach(tr => {
    tr.style.display = tr.dataset.search.includes(q) ? '' : 'none';
  });
}

const DETAIL_SORT_STATE = {};

function sortDetail(key, field, isNumeric){
  const table = document.getElementById('detail-'+key);
  const tbody = table.querySelector('tbody');
  const rows = Array.from(tbody.querySelectorAll('tr'));

  const state = DETAIL_SORT_STATE[key] || {};
  const dir = (state.field === field && state.dir === 'asc') ? 'desc' : 'asc';
  DETAIL_SORT_STATE[key] = { field, dir };

  rows.sort((a, b) => {
    let av = a.dataset['sort' + field.charAt(0).toUpperCase() + field.slice(1)];
    let bv = b.dataset['sort' + field.charAt(0).toUpperCase() + field.slice(1)];
    if (isNumeric) { av = parseFloat(av) || 0; bv = parseFloat(bv) || 0; }
    if (av < bv) return dir === 'asc' ? -1 : 1;
    if (av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });

  rows.forEach(tr => tbody.appendChild(tr));

  table.querySelectorAll('.sort-arrow').forEach(el => {
    el.textContent = el.dataset.arrowKey === field ? (dir === 'asc' ? ' ▲' : ' ▼') : '';
  });
}

  const entries = all.filter(n => !n.owner || ownerSet.has(n.owner));
  if (!entries.length) {
    return `<div class="tract-notes"><div class="tract-notes-heading">Field Notes</div>
      <div class="tract-notes-empty">No notes logged for this tract.</div></div>`;
  }
  const n = entries[0];
  return `<div class="tract-notes">
    <div class="tract-notes-heading">Field Notes</div>
    <div class="note-entry">
      <div class="note-meta"><span class="note-date">${n.date} · ${n.time}</span><span class="note-by">${n.by}</span></div>
      ${n.owner ? `<div class="note-owner">${n.owner}</div>` : ''}
      <div class="note-text">${n.text}</div>
    </div>
  </div>`;
}

let openTractProjectKey = null;

function showTractNote(prospect, tractId){
  const t = (TRACTS[prospect] || []).find(x => x.id === tractId);
  if (!t) return;
  const p = findProjectByProspect(prospect);
  openTractProjectKey = p ? p.key : null;
  const lengthStr = t.rods > 0 ? (t.rods/320).toFixed(2)+' mi' : '—';
  const ownersHtml = t.owners.map(o => `<div class="owner">${o}</div>`).join('');

  document.getElementById('tractPopup').innerHTML = `
    <div class="tract-popup-head">
      <div>
        <h3>${t.owners[0]}</h3>
        <div class="mono" style="color:var(--ink-faint)">${t.id}</div>
      </div>
      <button class="tract-popup-close" onclick="closeTractNote()">✕</button>
    </div>
    <div class="tract-popup-owners">
      <div class="label">${t.owners.length > 1 ? t.owners.length + ' owners of record' : 'Owner of record'}</div>
      ${ownersHtml}
    </div>
    <div class="tract-popup-grid">
      <div class="item"><div class="label">County</div><div class="val">${t.county}, ${t.state}</div></div>
      <div class="item"><div class="label">Segment</div><div class="val">${/MAINLINE/.test(t.ami || '') ? 'Mainline' : 'Buffer'}</div></div>
      <div class="item"><div class="label">Length</div><div class="val">${lengthStr}</div></div>
    </div>
    <div class="tract-popup-badges">
      <div class="row"><span class="label">Survey Packet</span>${badge(t.survey_packet)}</div>
      <div class="row"><span class="label">Title</span>${badge(t.title)}</div>
      <div class="row"><span class="label">Tract Status</span>${badge(t.tract_status)}</div>
    </div>
    ${notesSection(tractId, t.owners)}
    ${PARCELS[tractId] ? `<button class="map-view-btn" onclick="viewOnMap('${prospect}','${tractId}')">View parcel on map ↓</button>` : ''}`;
  document.getElementById('tractPopupOverlay').classList.add('active');
}

function closeTractNote(){
  document.getElementById('tractPopupOverlay').classList.remove('active');
  if (openTractProjectKey) {
    if (OPEN_TOOLTIP[openTractProjectKey]) {
      OPEN_TOOLTIP[openTractProjectKey].closeTooltip();
      OPEN_TOOLTIP[openTractProjectKey] = null;
    }
    zoomToProjectExtent(openTractProjectKey);
    openTractProjectKey = null;
  }
}

document.addEventListener('click', e => {
  const btn = e.target.closest('.landowner-link');
  if (btn) {
    showTractNote(btn.dataset.prospect, btn.dataset.tractId);
    highlightParcel(btn.dataset.prospect, btn.dataset.tractId);
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeTractNote();
});

function bucketForStatus(status){
  const s = status || '';
  if (s.indexOf('ACQUIRED') > -1) return 'Acquired';
  if (s === 'REFUSAL') return 'Refusal';
  if (s.indexOf('WORKING') > -1) return 'Working';
  return 'Open';
}

function statusBreakdown(p){
  const rows = TRACTS[p.prospect] || [];
  const buckets = { Acquired: 0, Working: 0, Open: 0, Refusal: 0 };
  rows.forEach(r => { buckets[bucketForStatus(r.tract_status)]++; });
  return buckets;
}

function stageProgress(p){
  const t = FULL_TABLES[p.key];
  const sp = parseRow(t.surveyPacket.curr[t.surveyPacket.curr.length-1], 2);
  const ti = parseRow(t.title.curr[t.title.curr.length-1], 2);
  const pe = parseRow(t.permission.curr[t.permission.curr.length-1], 3);
  const ro = parseRow(t.row.curr[t.row.curr.length-1], 3);
  return {
    titleSummary: [
      { label: 'Survey Packet', v: pct(sp.mids[1], sp.total) },
      { label: 'Title', v: pct(ti.mids[1], ti.total) }
    ],
    acquisitionSummary: [
      { label: 'Survey Permission', v: pct(pe.mids[2], pe.total) },
      { label: 'ROW Acquisition', v: pct(ro.mids[2], ro.total) }
    ]
  };
}

function barRows(stages){
  return stages.map(s => `<div class="bar-row">
    <div class="bar-row-label">${s.label}</div>
    <div class="bar-row-track"><div class="bar-row-fill" style="width:${s.v}%"></div></div>
    <div class="bar-row-val">${s.v.toFixed(0)}%</div>
  </div>`).join('');
}

function snapshotCard(p){
  const buckets = statusBreakdown(p);
  const total = Object.values(buckets).reduce((a,c) => a+c, 0) || 1;
  const segments = [
    { label: 'Acquired', val: buckets.Acquired, color: 'var(--green)' },
    { label: 'Working', val: buckets.Working, color: 'var(--blue)' },
    { label: 'Open', val: buckets.Open, color: 'var(--grey-bar)' },
    { label: 'Refusal', val: buckets.Refusal, color: 'var(--refusal)' }
  ].filter(s => s.val > 0);

  let cum = 0;
  const stops = segments.map(s => {
    const p1 = cum, p2 = cum + (s.val/total*100);
    cum = p2;
    return `${s.color} ${p1}% ${p2}%`;
  }).join(', ');

  const legend = segments.map(s => `<div class="donut-legend-item">
    <i style="background:${s.color}"></i><span>${s.label}</span>
    <span class="donut-legend-val">${s.val} · ${(s.val/total*100).toFixed(0)}%</span>
  </div>`).join('');

  const stages = stageProgress(p);

  return `<div class="card">
    <h2>Project Snapshot</h2>
    <div class="sub">${p.name}</div>
    <div class="snapshot-grid">
      <div class="donut-block">
        <div class="donut-outer">
          <div class="donut" style="background: conic-gradient(${stops});"></div>
          <div class="donut-hole"><div class="donut-total">${total}</div><div class="donut-total-label">tracts</div></div>
        </div>
        <div class="donut-legend">${legend}</div>
      </div>
      <div class="bar-chart">
        <div class="bar-group">
          <div class="bar-group-title">Title Summary</div>
          ${barRows(stages.titleSummary)}
        </div>
        <div class="bar-group">
          <div class="bar-group-title">Acquisition Summary</div>
          ${barRows(stages.acquisitionSummary)}
        </div>
      </div>
    </div>
  </div>`;
}

function parcelMapCard(p){
  const rows = TRACTS[p.prospect] || [];
  const withGeo = rows.filter(t => PARCELS[t.id]);
  const buckets = statusBreakdown(p);
  const legendItems = [
    { key: 'Acquired', label: 'Acquired', varName: '--green' },
    { key: 'Working', label: 'Working', varName: '--blue' },
    { key: 'Open', label: 'Open', varName: '--grey-bar' },
    { key: 'Refusal', label: 'Refusal', varName: '--refusal' }
  ].filter(l => buckets[l.key] > 0);
  const allBtn = `<button type="button" class="map-legend-item all-btn" data-status-key="" onclick="toggleStatusFilter('${p.key}','')">All</button>`;
  const legend = legendItems.map(l => `<button type="button" class="map-legend-item" data-status-key="${l.key}" onclick="toggleStatusFilter('${p.key}','${l.key}')"><i style="background:var(${l.varName})"></i>${l.label}</button>`).join('');
  const routeSwatches = (ROUTES[p.prospect] || []).map((rg, i) =>
    `<button type="button" class="map-legend-item route-item" id="route-btn-${p.key}-${i}" onclick="toggleRouteLayer('${p.key}',${i})"><i class="route-swatch" style="border-top-color:${rg.color}"></i>${rg.name}</button>`
  ).join('');
  return `<div class="card status-card parcel-map-card">
    <h2>Acquisition Map</h2>
    <div class="sub">${p.name} · ${withGeo.length} of ${rows.length} tracts mapped · click a parcel or a status below</div>
    <div id="map-${p.key}" class="parcel-map"></div>
    <div class="map-legend" id="legend-${p.key}">${allBtn}${legend}${routeSwatches}</div>
  </div>`;
}

const MAPS = {};

function statusColor(status){
  const s = status || '';
  const css = getComputedStyle(document.documentElement);
  if (s.indexOf('ACQUIRED') > -1) return css.getPropertyValue('--green').trim();
  if (s === 'REFUSAL') return css.getPropertyValue('--refusal').trim();
  if (s.indexOf('WORKING') > -1) return css.getPropertyValue('--blue').trim();
  return css.getPropertyValue('--grey-bar').trim();
}

function findProjectByProspect(prospect){
  return projects.find(pr => pr.prospect === prospect);
}

function initProjectMap(p){
  if (MAPS[p.key]) { MAPS[p.key].map.invalidateSize(); return; }
  const el = document.getElementById('map-' + p.key);
  if (!el || typeof L === 'undefined') return;

  const map = L.map(el, { scrollWheelZoom: true });
  const primaryTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'
  });
  let aerialFallbackApplied = false;
  primaryTiles.on('tileerror', () => {
    if (aerialFallbackApplied) return;
    aerialFallbackApplied = true;
    map.removeLayer(primaryTiles);
    L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Imagery: USGS National Map'
    }).addTo(map);
  });
  primaryTiles.addTo(map);

  const rows = TRACTS[p.prospect] || [];
  const layers = [];
  rows.forEach(t => {
    const coords = PARCELS[t.id];
    if (!coords) return;
    const color = statusColor(t.tract_status);
    const poly = L.polygon(coords, { color: color, weight: 1.5, fillColor: color, fillOpacity: 0.42 }).addTo(map);
    poly._tractId = t.id;
    poly._statusBucket = bucketForStatus(t.tract_status);
    poly.bindTooltip(`${t.owners[0]} · ${t.id}`, { sticky: true });
    poly.on('click', () => showTractNote(p.prospect, t.id));
    layers.push(poly);
  });

  const routeLayers = [];
  const routeGroups = ROUTES[p.prospect];
  if (routeGroups && routeGroups.length) {
    routeGroups.forEach(rg => {
      const layer = L.polyline(rg.segments, {
        color: rg.color, weight: 3, opacity: 0.95, lineCap: 'round', interactive: false
      }).addTo(map);
      layer.bindTooltip(`${rg.name} · ${p.name}`, { sticky: true });
      routeLayers.push(layer);
    });
  }

  const boundable = layers.slice().concat(routeLayers);
  let bounds = null;
  if (boundable.length) {
    const group = L.featureGroup(boundable);
    bounds = group.getBounds();
    map.fitBounds(bounds, { padding: [24, 24] });
  } else {
    map.setView([31.6, -103.7], 9);
  }
  MAPS[p.key] = { map, layers, routeLayers, bounds };
  applyStatusFilter(p.key);
}

const STATUS_FILTER = {};

function layerStyle(key, poly){
  const active = STATUS_FILTER[key];
  const match = !active || poly._statusBucket === active;
  return { weight: 1.5, opacity: match ? 1 : 0.15, fillOpacity: match ? 0.42 : 0.07 };
}

function applyStatusFilter(key){
  const rec = MAPS[key];
  const active = STATUS_FILTER[key] || null;
  const legendEl = document.getElementById('legend-' + key);
  if (legendEl) {
    legendEl.querySelectorAll('.map-legend-item').forEach(btn => {
      const isAllBtn = btn.classList.contains('all-btn');
      const match = isAllBtn ? !active : (btn.dataset.statusKey === active);
      btn.classList.toggle('active', !!match);
    });
  }
  if (!rec) return;
  rec.layers.forEach(poly => poly.setStyle(layerStyle(key, poly)));
}

function toggleRouteLayer(key, idx){
  const rec = MAPS[key];
  if (!rec) return;
  const layer = rec.routeLayers[idx];
  if (!layer) return;
  const btn = document.getElementById(`route-btn-${key}-${idx}`);
  if (layer._hidden) {
    layer.addTo(rec.map);
    layer._hidden = false;
    if (btn) btn.classList.remove('inactive');
  } else {
    rec.map.removeLayer(layer);
    layer._hidden = true;
    if (btn) btn.classList.add('inactive');
  }
}

function zoomToProjectExtent(key){
  const rec = MAPS[key];
  if (!rec) return;
  const active = STATUS_FILTER[key];
  if (!active) {
    if (rec.bounds && rec.bounds.isValid()) {
      rec.map.flyToBounds(rec.bounds, { padding: [24, 24], duration: 0.6 });
    }
  } else if (typeof L !== 'undefined') {
    const matching = rec.layers.filter(l => l._statusBucket === active);
    if (matching.length) {
      const b = L.featureGroup(matching).getBounds();
      if (b && b.isValid()) {
        rec.map.flyToBounds(b, { padding: [24, 24], duration: 0.6, maxZoom: 16 });
      }
    }
  }
}

function toggleStatusFilter(key, statusKey){
  const normalized = statusKey || null;
  STATUS_FILTER[key] = (STATUS_FILTER[key] === normalized) ? null : normalized;
  applyStatusFilter(key);
  zoomToProjectExtent(key);
}

function scrollToMapIfNeeded(key){
  if (window.innerWidth <= 900) {
    const el = document.getElementById('map-' + key);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function statusBadgeButton(prospect, val){
  const cls = STATUS_BADGE[val] || 'badge-open';
  const p = findProjectByProspect(prospect);
  if (!p) return badge(val);
  const key = bucketForStatus(val);
  return `<button type="button" class="badge ${cls} badge-btn" onclick="event.stopPropagation(); toggleStatusFilter('${p.key}','${key}'); scrollToMapIfNeeded('${p.key}');">${val || '—'}</button>`;
}

const OPEN_TOOLTIP = {};

function highlightParcel(prospect, tractId){
  const p = findProjectByProspect(prospect);
  if (!p) return;
  initProjectMap(p);
  const rec = MAPS[p.key];
  if (!rec) return;
  const poly = rec.layers.find(l => l._tractId === tractId);
  if (!poly) return;
  rec.map.flyToBounds(poly.getBounds(), { maxZoom: 15, duration: 0.6 });
  poly.setStyle({ weight: 4, fillOpacity: 0.7, opacity: 1 });
  if (OPEN_TOOLTIP[p.key] && OPEN_TOOLTIP[p.key] !== poly) {
    OPEN_TOOLTIP[p.key].closeTooltip();
  }
  poly.openTooltip();
  OPEN_TOOLTIP[p.key] = poly;
  setTimeout(() => poly.setStyle(layerStyle(p.key, poly)), 1800);
}

function viewOnMap(prospect, tractId){
  openTractProjectKey = null;
  document.getElementById('tractPopupOverlay').classList.remove('active');
  const p = findProjectByProspect(prospect);
  if (!p) return;
  const el = document.getElementById('map-' + p.key);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  setTimeout(() => highlightParcel(prospect, tractId), 350);
}

function renderProject(p){
  const t = FULL_TABLES[p.key];
  const spCurrTotal = parseRow(t.surveyPacket.curr[t.surveyPacket.curr.length-1], 2);
  const tCurrTotal   = parseRow(t.title.curr[t.title.curr.length-1], 2);
  const permCurrTotal = parseRow(t.permission.curr[t.permission.curr.length-1], 3);
  const rowCurrTotal  = parseRow(t.row.curr[t.row.curr.length-1], 3);

  const hero = `<div class="hero">
    ${heroStage('Survey Packet Complete', spCurrTotal.mids[1], spCurrTotal.total)}
    ${heroStage('Title Complete', tCurrTotal.mids[1], tCurrTotal.total)}
    ${heroStage('Survey Permission Acquired', permCurrTotal.mids[2], permCurrTotal.total)}
    ${heroStage('ROW Executed', rowCurrTotal.mids[2], rowCurrTotal.total)}
  </div>`;

  const surveyPacketCard = `<div class="card wide status-card">
    <h2>Survey Packet Status</h2>
    <div class="sub">${p.name} · ${fmtVal(spCurrTotal.total)} tracts</div>
    ${sheetCard(p.key, 'surveyPacket')}
  </div>`;

  const titleCard = `<div class="card wide status-card">
    <h2>Title Status</h2>
    <div class="sub">${p.name} · ${fmtVal(tCurrTotal.total)} tracts</div>
    ${sheetCard(p.key, 'title')}
  </div>`;

  const permissionCard = `<div class="card wide status-card">
    <h2>Survey Permission Status</h2>
    <div class="sub">${p.name} · ${fmtVal(permCurrTotal.total)} tracts</div>
    ${sheetCard(p.key, 'permission')}
    <div class="mileage-heading">Mileage</div>
    ${sheetCard(p.key, 'permissionMileage')}
  </div>`;

  const rowCard = `<div class="card wide status-card">
    <h2>ROW Acquisition Status</h2>
    <div class="sub">${p.name} · ${fmtVal(rowCurrTotal.total)} tracts · status source pending in RAW DATA</div>
    ${sheetCard(p.key, 'row')}
    <div class="mileage-heading">Mileage</div>
    ${sheetCard(p.key, 'rowMileage')}
  </div>`;

  return `<div class="project-layout">
    <div class="project-map-col">${parcelMapCard(p)}</div>
    <div class="project-main-col">
      ${hero}
      ${snapshotCard(p)}
      <div class="grid">${surveyPacketCard}${titleCard}${permissionCard}${rowCard}</div>
      ${tractTable(p)}
    </div>
  </div>`;
}

function overallPct(p){
  const t = FULL_TABLES[p.key];
  const sp = parseRow(t.surveyPacket.curr[t.surveyPacket.curr.length-1], 2);
  const ti = parseRow(t.title.curr[t.title.curr.length-1], 2);
  const pe = parseRow(t.permission.curr[t.permission.curr.length-1], 3);
  const ro = parseRow(t.row.curr[t.row.curr.length-1], 3);
  const vals = [pct(sp.mids[1],sp.total), pct(ti.mids[1],ti.total), pct(pe.mids[2],pe.total), pct(ro.mids[2],ro.total)];
  return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(0);
}

function tractCount(p){
  const arr = FULL_TABLES[p.key].surveyPacket.curr;
  return parseRow(arr[arr.length-1], 2).total;
}

function projectCounties(p){
  const rows = TRACTS[p.prospect] || [];
  return [...new Set(rows.map(r => r.county))];
}

function overviewCard(p){
  const t = FULL_TABLES[p.key];
  const sp = parseRow(t.surveyPacket.curr[t.surveyPacket.curr.length-1], 2);
  const ti = parseRow(t.title.curr[t.title.curr.length-1], 2);
  const pe = parseRow(t.permission.curr[t.permission.curr.length-1], 3);
  const ro = parseRow(t.row.curr[t.row.curr.length-1], 3);
  const mi = parseRow(t.permissionMileage.curr[t.permissionMileage.curr.length-1], 3);
  const counties = projectCounties(p);
  const rows = TRACTS[p.prospect] || [];
  const searchBlob = [p.name, ...counties, ...rows.map(r => r.id + ' ' + r.owners.join(' '))].join(' ').toLowerCase();

  const stages = [
    { label: 'Survey Packet', v: pct(sp.mids[1], sp.total) },
    { label: 'Title', v: pct(ti.mids[1], ti.total) },
    { label: 'Survey Permission', v: pct(pe.mids[2], pe.total) },
    { label: 'ROW Acquisition', v: pct(ro.mids[2], ro.total) }
  ];

  return `<div class="ov-card" data-key="${p.key}" data-search="${searchBlob}">
    <div class="ov-head">
      <h3>${p.name}</h3>
      <span class="ov-tracts">${fmtVal(sp.total)} tracts · ${counties.join(' & ')} County, TX</span>
    </div>
    <div class="ov-stages">
      ${stages.map(s => `<div class="ov-stage">
        <div class="ov-stage-label">${s.label}</div>
        <div class="track"><i style="width:${s.v}%"></i></div>
        <div class="ov-stage-pct">${s.v.toFixed(0)}%</div>
      </div>`).join('')}
    </div>
    ${notesBlock(p)}
    <div class="ov-foot">
      <span class="ov-mileage">${mi.total.toFixed(2)} mi total · ${mi.mids[2].toFixed(2)} mi survey permission acquired</span>
      <button class="ov-btn" onclick="selectTab('${p.key}')">Open dashboard →</button>
    </div>
  </div>`;
}

function notesBlock(p){
  const wn = WEEKLY_NOTES[p.key];
  if (!wn) return '';
  const highlights = wn.highlights || [];
  const actionItems = wn.actionItems || [];
  if (!highlights.length && !actionItems.length) return '';
  const periodStr = wn.reportingPeriod ? ` · Reporting period ${escapeHtml(wn.reportingPeriod)}` : '';
  const highlightsHtml = highlights.length
    ? `<div class="ov-notes-group">
        <ul class="ov-notes-list">${highlights.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ul>
      </div>`
    : '';
  const actionHtml = actionItems.length
    ? `<div class="ov-notes-group">
        <div class="ov-notes-label">Rolling Action Items</div>
        <ul class="ov-notes-list">${actionItems.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ul>
      </div>`
    : '';
  return `<div class="ov-notes">
    <div class="ov-notes-heading">Weekly Notes${periodStr}</div>
    ${highlightsHtml}${actionHtml}
  </div>`;
}



function buildOverview(){
  const grid = document.getElementById('overviewGrid');
  grid.innerHTML = projects.map(overviewCard).join('');
}

function filterOverview(){
  const q = document.getElementById('overviewSearch').value.toLowerCase();
  document.querySelectorAll('.ov-card').forEach(card => {
    const matchesSearch = !q || card.dataset.search.includes(q);
    card.classList.toggle('hidden', !matchesSearch);
  });
}

const tabsEl = document.getElementById('tabs');
const projectsEl = document.getElementById('projects');
document.getElementById('reportDate').textContent = REPORT_DATE;
document.getElementById('lastUpdated').textContent = LAST_UPDATED;

const overviewBtn = document.createElement('button');
overviewBtn.className = 'active';
overviewBtn.dataset.key = 'overview';
overviewBtn.innerHTML = `Overview`;
overviewBtn.addEventListener('click', () => selectTab('overview'));
tabsEl.appendChild(overviewBtn);

projects.forEach((p, i) => {
  const btn = document.createElement('button');
  btn.dataset.key = p.key;
  btn.innerHTML = `${p.name}<span class="n">${fmtVal(tractCount(p))} tracts</span>`;
  btn.addEventListener('click', () => selectTab(p.key));
  tabsEl.appendChild(btn);

  const div = document.createElement('div');
  div.className = 'project';
  div.id = 'proj-' + p.key;
  div.innerHTML = renderProject(p);
  projectsEl.appendChild(div);
});

buildOverview();

function selectTab(key){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.project').forEach(d => d.classList.toggle('active', d.id === 'proj-' + key));
  const p = projects.find(pr => pr.key === key);
  if (p) setTimeout(() => initProjectMap(p), 0);
}
</script>
